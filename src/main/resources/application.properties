spring.application.name=my-ai-agent
spring.ai.openai.chat.enabled=true
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.temperature=0


spring.ai.ollama.chat.enabled=false

spring.ai.ollama.base-url=http://localhost:11434
logging.level.org.springframework.web.client=debug
# Load OPENAI_API_KEY from .env when not started via run.sh (e.g. from the IDE)
spring.config.import=optional:file:.env[.properties]

server.port=8082
# Registered profiles are stored in a local H2 file so they survive restarts
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/my-ai-agent}
spring.jpa.hibernate.ddl-auto=update
