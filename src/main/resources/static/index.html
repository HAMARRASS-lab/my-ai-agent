<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dossier Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #07090b;
    --panel: #0d1114;
    --panel-2: #11171b;
    --line: #1e272d;
    --line-strong: #2c3940;
    --text: #d7e0e4;
    --muted: #6f7f88;
    --green: #3dfc9a;
    --green-dim: rgba(61, 252, 154, 0.12);
    --amber: #ffb547;
    --amber-dim: rgba(255, 181, 71, 0.12);
    --red: #ff5f56;
    --red-dim: rgba(255, 95, 86, 0.1);
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      linear-gradient(rgba(61, 252, 154, 0.025) 1px, transparent 1px) 0 0 / 100% 28px,
      radial-gradient(900px 400px at 50% -100px, rgba(61, 252, 154, 0.08), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--green); color: var(--bg); }

  .shell {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  .frame {
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--panel);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 30px 80px -30px rgba(61, 252, 154, 0.15);
    overflow: hidden;
  }

  /* Title bar */
  .titlebar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    font-size: 12px;
    letter-spacing: 0.08em;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    color: var(--green);
  }
  .brand svg { display: block; }
  .titlebar .spacer { flex: 1; }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
  }
  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .status.busy .pulse { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .status.down .pulse { background: var(--red); box-shadow: 0 0 8px var(--red); animation: none; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .badge {
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    padding: 2px 7px;
    color: var(--muted);
  }
  #clock { color: var(--muted); min-width: 64px; text-align: right; }

  /* Command line */
  .command {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--line);
  }
  .command-label {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  #dossier-form {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    background: var(--bg);
    padding: 6px 6px 6px 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #dossier-form:focus-within {
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-dim);
  }
  .prompt { color: var(--green); font-weight: 600; user-select: none; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    padding: 9px 0;
    caret-color: var(--green);
  }
  input[type="text"]:focus { outline: none; }
  input::placeholder { color: var(--muted); }
  button { font: inherit; cursor: pointer; }
  .run {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--green);
    background: var(--green);
    color: var(--bg);
    font-weight: 600;
    letter-spacing: 0.1em;
    border-radius: 3px;
    padding: 9px 18px;
    transition: background 0.15s, color 0.15s;
  }
  .run:hover { background: transparent; color: var(--green); }
  .run:disabled {
    background: var(--amber-dim);
    border-color: var(--amber);
    color: var(--amber);
    cursor: default;
  }
  kbd {
    font-family: var(--mono);
    font-size: 10px;
    border: 1px solid currentColor;
    border-radius: 2px;
    padding: 0 4px;
    opacity: 0.7;
  }

  .tickers {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    font-size: 12px;
  }
  .tickers .label { color: var(--muted); margin-right: 4px; letter-spacing: 0.1em; }
  .ticker {
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--text);
    border-radius: 3px;
    padding: 4px 10px;
    font-size: 12px;
    letter-spacing: 0.06em;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .ticker b { color: var(--green); font-weight: 600; margin-right: 6px; }
  .ticker:hover { border-color: var(--green); background: var(--green-dim); }

  /* Output area */
  #result { min-height: 320px; }
  .idle {
    padding: 56px 20px;
    text-align: center;
    color: var(--muted);
    line-height: 1.8;
  }
  .idle pre {
    color: var(--green);
    opacity: 0.8;
    font-size: 11px;
    line-height: 1.25;
    margin: 0 0 18px;
    display: inline-block;
    text-align: left;
  }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: var(--green);
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .section-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--muted);
  }
  .section-head .sym { color: var(--amber); font-weight: 600; }
  .section-head .spacer { flex: 1; }
  .ghost {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--muted);
    border-radius: 3px;
    padding: 4px 10px;
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  .ghost:hover { color: var(--green); border-color: var(--green); }

  /* Log (loading) */
  .log {
    padding: 18px 20px;
    line-height: 2;
    font-size: 13px;
  }
  .log .line { opacity: 0; animation: appear 0.2s forwards; }
  .log .ts { color: var(--muted); margin-right: 10px; }
  .log .ok { color: var(--green); }
  .log .run-tag { color: var(--amber); }
  .log .err { color: var(--red); }
  @keyframes appear { to { opacity: 1; } }

  /* Facts grid */
  .facts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    border-bottom: 1px solid var(--line);
  }
  .fact {
    padding: 16px 20px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin: 0 -1px -1px 0;
    min-width: 0;
  }
  .fact .k {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .fact .v {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    overflow-wrap: anywhere;
  }
  .fact:first-child .v { color: var(--green); }

  /* Report body */
  .report {
    padding: 8px 20px 26px;
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.7;
    color: #c5d0d5;
  }
  .report h1, .report h2, .report h3, .report h4 {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 24px 0 10px;
  }
  .report h1::before, .report h2::before, .report h3::before, .report h4::before {
    content: "## ";
    color: var(--muted);
  }
  .report p { margin: 0 0 12px; }
  .report ul, .report ol { margin: 0 0 14px; padding-left: 20px; }
  .report li { margin: 3px 0; }
  .report li::marker { color: var(--green); }
  .report strong { color: var(--text); font-weight: 600; }
  .report code {
    font-family: var(--mono);
    font-size: 0.86em;
    color: var(--green);
    background: var(--green-dim);
    padding: 1px 5px;
    border-radius: 2px;
  }
  .report hr { border: none; border-top: 1px dashed var(--line-strong); margin: 20px 0; }
  .report blockquote {
    margin: 0 0 14px;
    padding: 10px 14px;
    border-left: 2px solid var(--amber);
    background: var(--amber-dim);
  }
  .report blockquote p:last-child { margin: 0; }
  .table-wrap { overflow-x: auto; margin: 0 0 16px; }
  .report table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 13px;
  }
  .report th, .report td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .report th {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .report tr:hover td { background: var(--panel-2); }

  .error {
    margin: 20px;
    padding: 14px 16px;
    border: 1px solid var(--red);
    background: var(--red-dim);
    color: var(--red);
    border-radius: 3px;
    line-height: 1.6;
  }

  /* Footer status bar */
  .statusbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    padding: 8px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel-2);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }
  .statusbar .spacer { flex: 1; }
  .statusbar .recent-item {
    background: none;
    border: none;
    padding: 0;
    color: var(--text);
    font-size: 11px;
    text-decoration: underline dotted var(--muted);
    text-underline-offset: 3px;
  }
  .statusbar .recent-item:hover { color: var(--green); }
  .disclaimer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 16px; letter-spacing: 0.04em; }

  [hidden] { display: none !important; }

  /* User box */
  .user-box {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
  }
  .user-box::before { content: "USER:"; color: var(--muted); }
  #user-name { color: var(--green); }

  /* Login / register */
  .auth {
    max-width: 440px;
    margin: 0 auto;
    padding: 36px 20px 44px;
  }
  .auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .auth-tab {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    transition: background 0.15s, color 0.15s;
  }
  .auth-tab + .auth-tab { border-left: 1px solid var(--line-strong); }
  .auth-tab:hover { color: var(--text); }
  .auth-tab.active { background: var(--green-dim); color: var(--green); }
  .auth-intro {
    color: var(--muted);
    margin: 0 0 20px;
    line-height: 1.6;
  }
  .auth-intro::before { content: "// "; color: var(--line-strong); }
  .field { display: block; margin-bottom: 14px; }
  .field span {
    display: block;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    padding: 11px 12px;
    caret-color: var(--green);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-dim);
  }
  .field .hint { margin: 6px 0 0; font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
  .auth-error {
    border: 1px solid var(--red);
    background: var(--red-dim);
    color: var(--red);
    border-radius: 3px;
    padding: 10px 12px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .auth-submit { width: 100%; justify-content: center; margin-top: 6px; }

  @media (max-width: 600px) {
    .user-box::before { content: none; }
    .titlebar .badge, #clock { display: none; }
    .run .run-label, .run kbd { display: none; }
    .run { padding: 9px 12px; }
    .fact { padding: 12px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .log .line { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="frame">
      <header class="titlebar">
        <span class="brand">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          DOSSIER_AI
        </span>
        <span class="spacer"></span>
        <span class="status" id="status"><span class="pulse"></span><span id="status-text">READY</span></span>
        <span class="badge">GPT-4o</span>
        <span id="clock"></span>
        <span class="user-box" id="user-box" hidden>
          <span id="user-name"></span>
          <button type="button" class="ghost" id="logout-btn">LOGOUT</button>
        </span>
      </header>

      <section class="auth" id="auth-view" hidden>
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" data-mode="login" role="tab">LOGIN</button>
          <button type="button" class="auth-tab" data-mode="register" role="tab">REGISTER</button>
        </div>
        <form id="auth-form" novalidate>
          <p class="auth-intro" id="auth-intro"></p>
          <label class="field" data-for="register"><span>FULL NAME</span><input name="fullName" autocomplete="name" maxlength="100"></label>
          <label class="field" data-for="register"><span>EMAIL</span><input name="email" type="email" autocomplete="email"></label>
          <label class="field" data-for="register"><span>USERNAME</span><input name="username" autocomplete="username" maxlength="30" spellcheck="false">
            <p class="hint">3-30 chars: letters, digits, . _ -</p></label>
          <label class="field" data-for="login"><span>USERNAME OR EMAIL</span><input name="login" autocomplete="username" spellcheck="false"></label>
          <label class="field"><span>PASSWORD</span><input name="password" type="password">
            <p class="hint" data-for="register">At least 8 characters.</p></label>
          <div class="auth-error" id="auth-error" role="alert" hidden></div>
          <button type="submit" class="run auth-submit" id="auth-submit"></button>
        </form>
      </section>

      <div id="app-view" hidden>

      <section class="command">
        <div class="command-label">COMPANY LOOKUP</div>
        <form id="dossier-form" role="search">
          <span class="prompt" aria-hidden="true">&gt;</span>
          <input type="text" id="company" name="company" placeholder="enter company name…" autocomplete="off" spellcheck="false" aria-label="Company name" required>
          <button type="submit" class="run" id="submit-btn"><span class="run-label">RUN</span> <kbd>↵</kbd></button>
        </form>
        <div class="tickers">
          <span class="label">QUICK</span>
          <button type="button" class="ticker" data-q="Renault"><b>RNO</b>Renault</button>
          <button type="button" class="ticker" data-q="Apple"><b>AAPL</b>Apple</button>
          <button type="button" class="ticker" data-q="LVMH"><b>MC</b>LVMH</button>
          <button type="button" class="ticker" data-q="Toyota"><b>TM</b>Toyota</button>
          <button type="button" class="ticker" data-q="Airbus"><b>AIR</b>Airbus</button>
        </div>
      </section>

      <main id="result" aria-live="polite">
        <div class="idle">
<pre aria-hidden="true">  ▁▂▃▅▂▁▃▅▇▅▃▂▄▆█▆▄▂▃▅▇
 ─────────────────────── </pre><br>
          Awaiting query. Type a company and press <span style="color: var(--green)">RUN</span>.<br>
          <span class="cursor"></span>
        </div>
      </main>
      </div>

      <footer class="statusbar">
        <span>HISTORY:</span>
        <span id="recent-list">—</span>
        <span class="spacer"></span>
        <span>SRC: YAHOO + WIKIDATA + LLM</span>
        <span id="last-latency">LAT: —</span>
      </footer>
    </div>
    <p class="disclaimer">AI-generated analysis. Verify figures before making decisions.</p>
  </div>

  <script>
    const form = document.getElementById('dossier-form');
    const input = document.getElementById('company');
    const button = document.getElementById('submit-btn');
    const result = document.getElementById('result');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const recentList = document.getElementById('recent-list');
    const latencyEl = document.getElementById('last-latency');
    const clock = document.getElementById('clock');

    const authView = document.getElementById('auth-view');
    const appView = document.getElementById('app-view');
    const authForm = document.getElementById('auth-form');
    const authIntro = document.getElementById('auth-intro');
    const authError = document.getElementById('auth-error');
    const authSubmit = document.getElementById('auth-submit');
    const userBox = document.getElementById('user-box');
    const userName = document.getElementById('user-name');
    const logoutBtn = document.getElementById('logout-btn');

    const RECENT_KEY = 'dossier.recent';
    const STEPS = [
      'resolving company identity via wikidata',
      'fetching country / sector / founding year',
      'pulling live quote from yahoo finance',
      'loading reported revenue & profit',
      'running financial analysis model',
      'formatting report',
    ];
    const BUTTON_IDLE = '<span class="run-label">RUN</span> <kbd>↵</kbd>';
    const BUTTON_BUSY = '<span class="run-label">RUNNING…</span>';

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function inline(text) {
      return text
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
    }

    function splitRow(line) {
      return line.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    }

    function timestamp() {
      return new Date().toLocaleTimeString([], { hour12: false });
    }

    function setStatus(state, text) {
      statusEl.className = 'status' + (state ? ' ' + state : '');
      statusText.textContent = text;
    }

    // Pull "**Key:** value" lines (bulleted or not) out of the report so they can be shown as a data grid.
    function extractFacts(md) {
      const facts = [];
      const rest = [];
      for (const line of md.split('\n')) {
        const m = line.trim().match(/^(?:[-*+]\s+)?\*\*([^*:]+?)(?::\*\*|\*\*\s*:)\s*(.+)$/);
        if (m && m[2].length < 120) {
          facts.push([m[1].trim(), m[2].trim()]);
        } else {
          rest.push(line);
        }
      }
      return { facts, rest: rest.join('\n') };
    }

    // Small markdown renderer: headings, lists, tables, quotes, rules, bold/italic/code.
    function renderMarkdown(md) {
      const lines = escapeHtml(md).split('\n');
      let html = '';
      let list = null;

      const closeList = () => {
        if (list) { html += `</${list}>`; list = null; }
      };
      const openList = (tag) => {
        if (list !== tag) { closeList(); html += `<${tag}>`; list = tag; }
      };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) { closeList(); continue; }

        // Table: header row followed by a |---|---| separator row.
        if (line.startsWith('|') && /^\|?\s*:?-{2,}/.test((lines[i + 1] || '').trim())) {
          closeList();
          const head = splitRow(line);
          i += 2;
          let body = '';
          while (i < lines.length && lines[i].trim().startsWith('|')) {
            body += '<tr>' + splitRow(lines[i].trim()).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
            i++;
          }
          i--;
          html += '<div class="table-wrap"><table><thead><tr>' +
            head.map(c => `<th>${inline(c)}</th>`).join('') +
            `</tr></thead><tbody>${body}</tbody></table></div>`;
          continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          closeList();
          const level = Math.min(heading[1].length, 4);
          html += `<h${level}>${inline(heading[2])}</h${level}>`;
          continue;
        }

        if (/^(-{3,}|\*{3,})$/.test(line)) { closeList(); html += '<hr>'; continue; }

        // '>' was already escaped to '&gt;' above.
        const quote = line.match(/^&gt;\s?(.*)$/);
        if (quote) { closeList(); html += `<blockquote><p>${inline(quote[1])}</p></blockquote>`; continue; }

        const bullet = line.match(/^[-*+]\s+(.*)$/);
        if (bullet) { openList('ul'); html += `<li>${inline(bullet[1])}</li>`; continue; }

        const numbered = line.match(/^\d+[.)]\s+(.*)$/);
        if (numbered) { openList('ol'); html += `<li>${inline(numbered[1])}</li>`; continue; }

        closeList();
        html += `<p>${inline(line)}</p>`;
      }
      closeList();
      return html;
    }

    function loadRecent() {
      try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; }
    }

    function saveRecent(company) {
      const list = [company, ...loadRecent().filter(c => c.toLowerCase() !== company.toLowerCase())].slice(0, 5);
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch { /* storage unavailable */ }
      renderRecent();
    }

    function renderRecent() {
      const list = loadRecent();
      recentList.innerHTML = list.length
        ? list.map(c => `<button type="button" class="recent-item" data-q="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join(' · ')
        : '—';
    }

    function logLine(log, tag, cls, text) {
      const div = document.createElement('div');
      div.className = 'line';
      div.innerHTML = `<span class="ts">${timestamp()}</span><span class="${cls}">[${tag}]</span> ${escapeHtml(text)}`;
      log.appendChild(div);
      return div;
    }

    function showLoading(company) {
      result.innerHTML = `
        <div class="section-head"><span class="sym">${escapeHtml(company.toUpperCase())}</span><span>QUERY IN PROGRESS</span></div>
        <div class="log" id="log"></div>`;
      const log = document.getElementById('log');
      logLine(log, 'SYS', 'ok', `query accepted: "${company}"`);
      let step = 0;
      let current = logLine(log, ' .. ', 'run-tag', STEPS[0] + '…');
      // The backend answers in a single response, so advance the log on a timer
      // and hold on the last step until the response arrives.
      return setInterval(() => {
        if (step >= STEPS.length - 1) return;
        current.querySelector('.run-tag').textContent = '[ OK ]';
        current.querySelector('.run-tag').className = 'ok';
        step++;
        current = logLine(log, ' .. ', 'run-tag', STEPS[step] + '…');
      }, 2000);
    }

    function showDossier(company, markdown, seconds) {
      const { facts, rest } = extractFacts(markdown);
      const factsHtml = facts.length
        ? `<div class="facts">${facts.map(([k, v]) =>
            `<div class="fact"><div class="k">${escapeHtml(k)}</div><div class="v">${inline(escapeHtml(v))}</div></div>`).join('')}</div>`
        : '';

      result.innerHTML = `
        <div class="section-head">
          <span class="sym">${escapeHtml(company.toUpperCase())}</span>
          <span>DOSSIER · ${seconds}s</span>
          <span class="spacer"></span>
          <button type="button" class="ghost" id="copy-btn">COPY MD</button>
        </div>
        ${factsHtml}
        <div class="report">${renderMarkdown(rest)}</div>`;

      const copyBtn = document.getElementById('copy-btn');
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(markdown);
          copyBtn.textContent = 'COPIED';
        } catch {
          copyBtn.textContent = 'COPY FAILED';
        }
        setTimeout(() => { copyBtn.textContent = 'COPY MD'; }, 1800);
      });
    }

    function showError(message) {
      result.innerHTML = `
        <div class="section-head"><span class="sym" style="color: var(--red)">ERROR</span><span>REQUEST FAILED</span></div>
        <div class="error" role="alert">[ERR] ${escapeHtml(message)}</div>`;
    }

    async function fetchDossier(company) {
      button.disabled = true;
      button.innerHTML = BUTTON_BUSY;
      setStatus('busy', 'PROCESSING');
      const timer = showLoading(company);
      const started = performance.now();

      try {
        const res = await fetch('/financialAnalysis?company=' + encodeURIComponent(company));
        const text = await res.text();
        const seconds = ((performance.now() - started) / 1000).toFixed(1);
        latencyEl.textContent = `LAT: ${seconds}s`;

        if (res.status === 401) {
          showAuth('Your session has expired. Please log in again.');
          return;
        }

        if (!res.ok) {
          setStatus('down', 'ERROR');
          showError(text || ('Request failed with status ' + res.status));
          return;
        }

        setStatus('', 'READY');
        showDossier(company, text, seconds);
        saveRecent(company);
      } catch (err) {
        setStatus('down', 'OFFLINE');
        showError('Could not reach the server. Is it running?');
      } finally {
        clearInterval(timer);
        button.disabled = false;
        button.innerHTML = BUTTON_IDLE;
      }
    }

    function search(company) {
      company = company.trim();
      if (!company || button.disabled) return;
      input.value = company;
      fetchDossier(company);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      search(input.value);
    });

    // Ticker buttons and history entries both trigger a search.
    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-q]');
      if (target) search(target.dataset.q);
    });

    function tick() { clock.textContent = timestamp(); }
    setInterval(tick, 1000);
    tick();

    // --- Login / register ---

    const AUTH_MODES = {
      login: { intro: 'Log in to access the dossier terminal.', submit: 'LOGIN', password: 'current-password' },
      register: { intro: 'Create a profile to start analyzing companies.', submit: 'CREATE PROFILE', password: 'new-password' },
    };
    let authMode = 'login';

    function setAuthMode(mode) {
      authMode = mode;
      document.querySelectorAll('.auth-tab').forEach(tab => {
        const active = tab.dataset.mode === mode;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', active);
      });
      authForm.querySelectorAll('[data-for]').forEach(el => { el.hidden = el.dataset.for !== mode; });
      authIntro.textContent = AUTH_MODES[mode].intro;
      authSubmit.textContent = AUTH_MODES[mode].submit;
      authForm.elements.password.autocomplete = AUTH_MODES[mode].password;
      authError.hidden = true;
      focusFirstField();
    }

    function focusFirstField() {
      const first = [...authForm.querySelectorAll('input')].find(el => !el.closest('[hidden]'));
      if (first) first.focus();
    }

    function showAuthError(message) {
      authError.textContent = message;
      authError.hidden = false;
    }

    function showAuth(message) {
      appView.hidden = true;
      userBox.hidden = true;
      authView.hidden = false;
      setStatus('down', 'LOCKED');
      authForm.elements.password.value = '';
      if (message) showAuthError(message); else authError.hidden = true;
      focusFirstField();
    }

    function showApp(user) {
      authView.hidden = true;
      appView.hidden = false;
      userBox.hidden = false;
      userName.textContent = user.username;
      userName.title = `${user.fullName} <${user.email}>`;
      setStatus('', 'READY');
      input.focus();
    }

    // Spring returns validation errors as ProblemDetail JSON; fall back to plain text.
    async function errorMessage(res) {
      const text = await res.text();
      try { return JSON.parse(text).detail || text; } catch { return text || `Request failed (${res.status})`; }
    }

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = authForm.elements;
      const body = authMode === 'login'
        ? { login: f.login.value.trim(), password: f.password.value }
        : { fullName: f.fullName.value.trim(), email: f.email.value.trim(), username: f.username.value.trim(), password: f.password.value };

      authSubmit.disabled = true;
      authSubmit.textContent = authMode === 'login' ? 'LOGGING IN…' : 'CREATING…';
      try {
        const res = await fetch(`/api/auth/${authMode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          showAuthError(await errorMessage(res));
          return;
        }
        authForm.reset();
        showApp(await res.json());
      } catch {
        showAuthError('Could not reach the server. Is it running?');
      } finally {
        authSubmit.disabled = false;
        authSubmit.textContent = AUTH_MODES[authMode].submit;
      }
    });

    document.querySelectorAll('.auth-tab').forEach(tab =>
      tab.addEventListener('click', () => setAuthMode(tab.dataset.mode)));

    logoutBtn.addEventListener('click', async () => {
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch { /* logged out locally anyway */ }
      setAuthMode('login');
      showAuth();
    });

    async function init() {
      button.innerHTML = BUTTON_IDLE;
      renderRecent();
      setAuthMode('login');
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) { showApp(await res.json()); return; }
      } catch { /* fall through to the login screen */ }
      showAuth();
    }

    init();
  </script>
</body>
</html>
