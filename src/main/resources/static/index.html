<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Dossier</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #9aa1ad;
    --accent: #5b8cff;
    --danger: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #dfe2e8;
      --text: #1a1d23;
      --muted: #5c6470;
      --accent: #3b63e0;
      --danger: #c92a2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 720px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.95rem;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .panel {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 12px;
    padding: 24px;
    min-height: 120px;
  }
  .hint {
    color: var(--muted);
  }
  .error {
    color: var(--danger);
  }
  .dossier h1, .dossier h2, .dossier h3 {
    margin-top: 0;
  }
  .dossier p {
    line-height: 1.55;
  }
  .dossier ul {
    line-height: 1.55;
  }
  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Company Dossier</h1>
    <p class="subtitle">Look up a company for a quick AI-generated financial dossier.</p>

    <form id="dossier-form">
      <input type="text" id="company" name="company" placeholder="e.g. Apple" autocomplete="off" required>
      <button type="submit" id="submit-btn">Search</button>
    </form>

    <div class="panel" id="result">
      <p class="hint">Enter a company name above to generate its dossier.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('dossier-form');
    const input = document.getElementById('company');
    const button = document.getElementById('submit-btn');
    const result = document.getElementById('result');

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // Minimal markdown renderer: headings, bold, italics, lists, paragraphs.
    function renderMarkdown(md) {
      const lines = escapeHtml(md).split('\n');
      let html = '';
      let inList = false;

      const closeList = () => {
        if (inList) { html += '</ul>'; inList = false; }
      };

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) { closeList(); continue; }

        const heading = line.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          closeList();
          const level = heading[1].length;
          html += `<h${level}>${inline(heading[2])}</h${level}>`;
          continue;
        }

        const listItem = line.match(/^[-*]\s+(.*)$/);
        if (listItem) {
          if (!inList) { html += '<ul>'; inList = true; }
          html += `<li>${inline(listItem[1])}</li>`;
          continue;
        }

        closeList();
        html += `<p>${inline(line)}</p>`;
      }
      closeList();
      return html;
    }

    function inline(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
    }

    async function fetchDossier(company) {
      button.disabled = true;
      button.innerHTML = '<span class="spinner"></span>';
      result.innerHTML = '<p class="hint">Generating dossier…</p>';

      try {
        const res = await fetch('/financialAnalysis?company=' + encodeURIComponent(company));
        const text = await res.text();

        if (!res.ok) {
          result.innerHTML = `<p class="error">${escapeHtml(text || ('Request failed with status ' + res.status))}</p>`;
          return;
        }

        result.innerHTML = `<div class="dossier">${renderMarkdown(text)}</div>`;
      } catch (err) {
        result.innerHTML = `<p class="error">Could not reach the server. Is it running?</p>`;
      } finally {
        button.disabled = false;
        button.textContent = 'Search';
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const company = input.value.trim();
      if (!company) return;
      fetchDossier(company);
    });
  </script>
</body>
</html>
